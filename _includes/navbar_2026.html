<script>
    document.addEventListener('DOMContentLoaded', function() {
        // Only target the arrow icon for expanding/collapsing
        const dropdownIcons = document.querySelectorAll('.dropdown > a > i');
        dropdownIcons.forEach(icon => {
            icon.addEventListener('click', function(e) {
                if (window.innerWidth <= 1100) {
                    e.preventDefault();
                    e.stopPropagation(); // Prevent the click from navigating the link
                    this.closest('.dropdown').classList.toggle('mobile-open');
                }
            });
        });
    });
</script>
