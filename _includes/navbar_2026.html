<style>
@media (max-width: 1100px) {
    .navbar-nav.show {
        max-height: 600px !important;
    }
    .dropdown {
        flex-direction: column;
        align-items: center;
        width: 100%;
    }
    .dropdown-content {
        position: relative !important;
        top: 0 !important;
        left: 0 !important;
        box-shadow: none !important;
        width: 100% !important;
        background-color: #f9f9f9 !important;
        border-top: none !important;
    }
    .dropdown:hover .dropdown-content {
        display: none !important;
    }
    .dropdown.mobile-open .dropdown-content {
        display: block !important;
    }
    .dropdown-content a {
        text-align: center !important;
        padding: 10px !important;
        margin: 0 !important;
        width: 100% !important;
        border-bottom: 1px solid #eaeaea;
        transform: translateX(10px);
    }
    .dropdown-content a::before {
        content: "\f105";
        font-family: "FontAwesome";
        margin-right: 8px;
        color: var(--secondary-color);
    }
    .dropdown-content a:last-child {
        border-bottom: none;
    }
    .dropdown > a > i {
        padding: 15px 20px;
        margin-right: -20px; /* offset the padding to keep it visually next to text */
        cursor: pointer;
    }
}
</style>
<script>
    document.addEventListener('DOMContentLoaded', function() {
        // Only target the arrow icon for expanding/collapsing
        const dropdownIcons = document.querySelectorAll('.dropdown > a > i');
        dropdownIcons.forEach(icon => {
            icon.addEventListener('click', function(e) {
                if (window.innerWidth <= 1100) {
                    e.preventDefault();
                    e.stopPropagation(); // Prevent the click from navigating the link
                    this.closest('.dropdown').classList.toggle('mobile-open');
                }
            });
        });
    });
</script>
