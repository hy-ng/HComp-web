<!DOCTYPE html>
<html lang="en">

<head>
    <!-- Instant Redirect to ACM HCOMP domain -->
    <script>
        window.location.replace("https://hcomp.acm.org" + window.location.pathname + window.location.search + window.location.hash);
    </script>
    <meta http-equiv="refresh" content="0; url=https://hcomp.acm.org{{ page.url }}" />
    <link rel="canonical" href="https://hcomp.acm.org{{ page.url }}" />

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="">
    <meta name="author" content="">

    <title>{{ title }}</title>

    <!-- Bootstrap Core CSS -->
    <link href="css/bootstrap.min.css" rel="stylesheet">

    <!--   favicon link-->
    <link rel="shortcut icon" type="image/png" href="img/favicon.png" />

    <!-- Custom CSS  -->
    <link href="css/landing-page.css?{{site.time | date: '%s%N'}}" rel="stylesheet">
    <link href="css/components.css?{{site.time | date: '%s%N'}}" rel="stylesheet">

    <!-- Custom Fonts -->
    <link href="font-awesome/css/font-awesome.min.css" rel="stylesheet" type="text/css">
    <link href="https://fonts.googleapis.com/css?family=Quattrocento+Sans:400,400i,700,700i" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css?family=Open+Sans:400,600,700,900" rel="stylesheet">

    <style>
        :root {
            --primary-color: #861F41;
            --secondary-color: #E87722;
            --dark-bg: #1a1a1a;
            --light-bg: #f9f9f9;
            --text-main: #333333;
            --text-muted: #555555;
            --white: #ffffff;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html {
            scroll-padding-top: 100px;
            /* Pre-scrolls anchor targets below navbar */
            scroll-behavior: smooth;
        }

        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            font-weight: 400;
            line-height: 1.6;
            color: var(--text-main);
            background-color: var(--white);
            padding-top: 60px;
            /* Prevents fixed navbar from overlapping content */
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        h1,
        h2,
        h3,
        h4 {
            line-height: 1.2;
            margin-bottom: 1rem;
            color: var(--primary-color);
            font-weight: 700;
        }

        .page-content {
            flex: 1 0 auto;
            width: 100%;
        }

        .page-content h1 {
            margin-top: 2.0rem;
        }

        .page-content h2 {
            margin-top: 1.5rem;
        }

        .page-content>*:first-child {
            margin-top: 0 !important;
        }

        /* Container & Layout */
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0.25rem 20px;
        }



        /* Subpage Hero Banner */
        .subpage-hero {
            height: 200px;
            min-height: 200px;
            flex-shrink: 0;
            /* Prevents compression on extremely long or short pages due to body flex */
            background: linear-gradient(rgba(0, 0, 0, 0.5), rgba(0, 0, 0, 0.5)), url('images/ab1.jpg') no-repeat center center;
            background-size: cover;
            width: 100%;
            display: flex;
            align-items: flex-end;
            padding-bottom: 20px;
        }

        .hero-breadcrumb-container {
            width: 100%;
        }

        .hero-breadcrumb {
            color: rgba(255, 255, 255, 0.8);
            font-size: 0.85rem;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .hero-breadcrumb a {
            color: rgba(255, 255, 255, 0.8);
            text-decoration: none;
            transition: color 0.2s;
        }

        .hero-breadcrumb a:hover {
            color: var(--secondary-color);
        }

        .hero-breadcrumb span {
            color: white;
            font-weight: 700;
        }

        /* Page Content Specific Setup */
        .page-content {
            margin-top: 2rem;
            margin-bottom: 4rem;
        }

        .page-content a {
            color: var(--primary-color);
            text-decoration: none;
            font-weight: 600;
            border-bottom: 1px solid rgba(134, 31, 65, 0.3);
            transition: color 0.2s ease, border-bottom-color 0.2s ease;
        }

        .page-content a:hover {
            color: var(--secondary-color);
            border-bottom-color: var(--secondary-color);
        }

        .page-content p {
            margin-bottom: 1.5rem;
        }

        .page-content ul,
        .page-content ol {
            margin-bottom: 1.5rem;
            padding-left: 2rem;
        }

        .page-content li {
            margin-bottom: 0.5rem;
        }

        /* Markdown Table Styles (Responsive & Professional) */
        .page-content table {
            width: 100%;
            border-collapse: collapse;
            margin: 2.5rem 0;
            font-size: 1rem;
            background-color: var(--white);
            display: block;
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
            border: 1px solid #ddd;
            border-radius: 8px;
        }

        .page-content th,
        .page-content td {
            padding: 14px 18px;
            border: 1px solid #e0e0e0;
            text-align: left;
            min-width: 150px;
        }

        .page-content th {
            background-color: #f8f8f8;
            color: var(--primary-color);
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            border-bottom: 2px solid var(--secondary-color);
        }

        .page-content tr:nth-of-type(even) {
            background-color: #fafafa;
        }

        .page-content tr:hover {
            background-color: #f3f3f3;
        }


        .sub-page-header {
            font-size: 2.2rem;
            text-align: center;
            margin-top: 3.5rem;
            margin-bottom: 0.5rem;
        }

        .sub-page-header::after {
            content: '';
            display: block;
            width: 60px;
            height: 4px;
            background-color: var(--secondary-color);
            margin: 15px auto 3rem;
            border-radius: 2px;
        }

        .sub-page-border {
            display: none;
        }

        /* Footer */
        footer {
            background-color: var(--dark-bg);
            color: var(--white);
            text-align: center;
            padding: 2rem 20px;
        }

        footer p {
            opacity: 0.7;
            font-size: 0.9rem;
        }

        mark {
            background-color: transparent;
            color: inherit;
            font-weight: bold;
        }

        /* Organizers Legacy Structure Support */
        .organizers-header {
            height: 10px;
        }

        .profile-row {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            margin-bottom: 2rem;
            gap: 20px;
        }

        /* Bootstrap grid flex fallbacks */
        .row {
            display: flex;
            flex-wrap: wrap;
        }

        .col-md-1,
        .col-md-3,
        .col-md-4,
        .col-md-5,
        .col-md-6,
        .col-md-12 {
            display: flex;
            flex-direction: column;
            padding: 15px;
            box-sizing: border-box;
        }

        .profile-row>div {
            align-items: center;
            text-align: center;
        }

        .col-md-12 {
            width: 100%;
            flex: 0 0 100% !important;
            max-width: 100% !important;
        }

        .col-md-6 {
            width: calc(50% - 20px);
            flex: 0 0 calc(50% - 20px) !important;
            max-width: calc(50% - 20px) !important;
        }

        .col-md-5 {
            width: calc(41.666% - 20px);
            flex: 0 0 calc(41.666% - 20px) !important;
            max-width: calc(41.666% - 20px) !important;
        }

        .col-md-4 {
            width: calc(33.333% - 20px);
            flex: 0 0 calc(33.333% - 20px) !important;
            max-width: calc(33.333% - 20px) !important;
        }

        .col-md-3 {
            width: calc(25% - 20px);
            flex: 0 0 calc(25% - 20px) !important;
            max-width: calc(25% - 20px) !important;
        }

        @media (max-width: 850px) {

            .col-md-3,
            .col-md-4,
            .col-md-5,
            .col-md-6 {
                width: 100%;
                flex: 0 0 100% !important;
                max-width: 100% !important;
            }
        }

        ul.list-inline {
            padding-left: 0 !important;
            list-style: none !important;
            margin-bottom: 0.5rem;
        }

        ul.list-inline>li {
            display: inline-block;
        }

        .text-center {
            text-align: center;
        }

        /* Compress Past Meetings and Proceedings Grid */
        .intro-paragraph.text-center .col-md-6 {
            padding-top: 5px;
            padding-bottom: 5px;
        }

        .intro-paragraph.text-center p {
            margin-bottom: 5px;
        }

        .intro-paragraph.text-center .theme-link-org {
            font-size: 1.2rem;
            font-weight: 600;
        }

        .photo-size {
            width: 180px;
            height: 180px;
            object-fit: cover;
            border: 4px solid var(--white);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            margin-bottom: 1.5rem;
        }

        .rounded-circle {
            border-radius: 50%;
        }

        .theme-link-org {
            color: var(--primary-color);
            text-decoration: none;
            font-weight: 700;
            font-size: 1.4rem;
            transition: color 0.3s ease;
        }

        .theme-link-org:hover {
            color: var(--secondary-color);
        }

        .organizers .lead {
            font-size: 1.1rem;
            color: var(--text-muted);
            margin-bottom: 0;
            line-height: 1.4;
        }

        .organizer-name {
            text-align: center;
            font-size: 2rem;
            color: var(--primary-color);
            margin-top: 4rem;
            margin-bottom: 2rem;
            position: relative;
        }
    </style>
</head>

<body>

    <!-- Navigation -->
    {% include navbar_2026.html %}

    <!-- Subpage Hero Banner -->
    <div class="subpage-hero">
        <div class="container hero-breadcrumb-container">
            <div class="hero-breadcrumb">
                <a href="index.html">HCOMP 2026</a> 
                {% if page.parent %}
                    / <a href="{{ page.parent_url }}">{{ page.parent }}</a>
                {% endif %}
                / <span>{{ page.title }}</span>
            </div>
        </div>
    </div>

    <!-- Page Content -->
    <main class="page-content container">
        {{ content }}
    </main>

    <!-- Footer -->
    <footer>
        <p>&copy; 2026 Association for Computing Machinery. All rights reserved.</p>
    </footer>

    <script>
        document.getElementById('hamburger').addEventListener('click', function () {
            document.getElementById('nav-links').classList.toggle('show');
        });

        // Dynamic Sticky Positioning for Sub-navbars
        // This ensures sub-navs always sit perfectly under the main navbar across all devices
        const updateSubnavPosition = () => {
            const mainNav = document.querySelector('.navbar');
            const subnavs = document.querySelectorAll('.sticky-subnav');
            if (mainNav && subnavs.length > 0) {
                const height = mainNav.offsetHeight;
                subnavs.forEach(nav => {
                    nav.style.top = (height - 1) + 'px'; // 1px overlap to eliminate tiny gaps
                });
                document.documentElement.style.setProperty('--navbar-height', height + 'px');
            }
        };

        window.addEventListener('DOMContentLoaded', updateSubnavPosition);
        window.addEventListener('load', updateSubnavPosition);
        window.addEventListener('resize', updateSubnavPosition);
    </script>
</body>

</html>
